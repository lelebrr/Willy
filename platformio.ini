; ===== Willy ESP32-S3 N8R2/N16R8 (unificado de Willy_ESP32_S3) =====
; Envs dedicados p/ ESP32-S3-WROOM-1 N8R2/N16R8 + ILI9341. Nao altera default_envs acima.
[env:willy_release]
board = ESP32-S3-DevKitC-1-N8R2
